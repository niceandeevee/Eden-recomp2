# Builds the Galaxy S24+ (Snapdragon 8 Gen 3) APK of Eden on GitHub's free runners.
# Free for public repositories. Run it from the Actions tab ("Build Eden S24+ APK" -> Run workflow),
# or push to the main branch. The installable APK is attached to the run as an artifact.

name: Build Eden S24+ APK

on:
  workflow_dispatch:
    inputs:
      lto:
        description: "Link-time optimization (faster code, longer build). Falls back to a non-LTO build if it fails."
        type: boolean
        default: true
      pgo:
        description: "PGO: 'auto' uses a committed profile in pgo/ if present; 'generate' builds the instrumented APK used to record one"
        type: choice
        options: [auto, generate, "off"]
        default: auto
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: build-s24-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      NDK_VERSION: "28.2.13676358"
      CMAKE_VERSION: "3.31.5"
      CCACHE: "true"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: "3G"
      CCACHE_COMPRESS: "true"
      USE_LTO: ${{ (github.event_name == 'push' || inputs.lto) && inputs.pgo != 'generate' }}
      PGO: ${{ inputs.pgo || 'auto' }}

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/.ghcup \
                      /usr/local/share/powershell /usr/share/swift /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the app version name comes from `git describe`

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" "platforms;android-36" "build-tools;36.0.0"

      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y ccache ninja-build glslang-tools

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: |
            .ccache
            .cache/cpm
          key: s24-${{ runner.os }}-${{ github.sha }}
          restore-keys: s24-${{ runner.os }}-

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('src/android/**/*.gradle.kts', 'src/android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Prepare PGO
        shell: bash
        run: |
          PGO_ARGS=""
          if [ "$PGO" = "generate" ]; then
            PGO_ARGS="-DEDEN_PGO_MODE=generate"
            echo "::notice::Building the PGO-instrumented APK (slower; used only to record a profile)"
          elif [ "$PGO" = "auto" ] && ls pgo/* >/dev/null 2>&1; then
            PROFDATA_BIN="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-profdata"
            work="$RUNNER_TEMP/pgo"; mkdir -p "$work"
            for f in pgo/*; do
              case "$f" in
                *.profdata) cp "$f" "$work/" ;;
                *.profraw) cp "$f" "$work/" ;;
                *.xz)  xz -dc "$f" > "$work/$(basename "${f%.xz}")" ;;
                *.zst) zstd -dc "$f" > "$work/$(basename "${f%.zst}")" ;;
                *.gz)  gzip -dc "$f" > "$work/$(basename "${f%.gz}")" ;;
                *.zip) unzip -o -j "$f" -d "$work" ;;
              esac
            done
            ls -l "$work"
            "$PROFDATA_BIN" merge -o "$RUNNER_TEMP/eden.profdata" $(ls "$work"/*.profraw "$work"/*.profdata 2>/dev/null)
            "$PROFDATA_BIN" show "$RUNNER_TEMP/eden.profdata" | tail -5
            PGO_ARGS="-DEDEN_PGO_MODE=use -DEDEN_PGO_PROFILE=$RUNNER_TEMP/eden.profdata"
            echo "::notice::Using PGO profile from pgo/"
          fi
          echo "PGO_ARGS=$PGO_ARGS" >> "$GITHUB_ENV"

      - name: Build APK (with LTO)
        id: build_lto
        if: env.USE_LTO == 'true'
        continue-on-error: true
        shell: bash
        run: |
          chmod +x .ci/android/build.sh
          .ci/android/build.sh -t s24 -b Release -DENABLE_LTO=ON $PGO_ARGS 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Build APK (without LTO)
        if: env.USE_LTO != 'true' || steps.build_lto.outcome == 'failure'
        shell: bash
        run: |
          if [ "${{ steps.build_lto.outcome }}" = "failure" ]; then
            echo "::warning::LTO build failed; rebuilding without LTO"
            rm -rf build src/android/app/.cxx src/android/app/build artifacts
          fi
          chmod +x .ci/android/build.sh
          .ci/android/build.sh -t s24 -b Release $PGO_ARGS 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Show build errors
        if: failure()
        shell: bash
        run: |
          L="$RUNNER_TEMP/build.log"
          enc() { sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g'; }
          grep -n -E ': error:|CMake Error|What went wrong|FAILURE:|Execution failed|ld.lld: error|Caused by|^-- ! ' "$L" | cut -c1-300 | head -25 | tail -c 3800 > "$RUNNER_TEMP/e1.txt" || true
          tail -30 "$L" | cut -c1-300 | tail -c 3800 > "$RUNNER_TEMP/e2.txt" || true
          echo "::error title=Build errors::$(enc < "$RUNNER_TEMP/e1.txt")"
          echo "::error title=Build tail::$(enc < "$RUNNER_TEMP/e2.txt")"

      - name: Rename APK
        run: |
          ls -l artifacts
          VERSION=$(git describe --always --long | sed -E 's/(-0)?-[^-]+$//')
          mkdir -p upload
          SUFFIX=""; [ "$PGO" = "generate" ] && SUFFIX="-PGO-INSTRUMENTED"
          for f in artifacts/*.apk; do cp "$f" "upload/Eden-S24plus-${VERSION}${SUFFIX}.apk"; done
          ls -l upload

      - name: APK size breakdown
        continue-on-error: true
        shell: bash
        run: |
          apk=$(ls upload/*.apk | head -1)
          ls -l "$apk"
          # Biggest entries: compressed size, uncompressed size, path
          unzip -lv "$apk" | awk 'NR>3 && $1 ~ /^[0-9]+$/ {printf "%9d %9d %s\n", $3, $1, $8}' | sort -nr > "$RUNNER_TEMP/sizes_all.txt"
          head -25 "$RUNNER_TEMP/sizes_all.txt" > "$RUNNER_TEMP/sizes.txt"
          cat "$RUNNER_TEMP/sizes.txt"
          msg=$( { echo "compressed  uncompressed  path"; cat "$RUNNER_TEMP/sizes.txt"; } | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          echo "::notice title=APK size breakdown::$msg"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Eden-S24plus-APK
          path: upload/*.apk
          if-no-files-found: error
          retention-days: 30
