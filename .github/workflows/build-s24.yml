# Builds the Galaxy S24+ (Snapdragon 8 Gen 3) APK of Eden on GitHub's free runners.
# Free for public repositories. Run it from the Actions tab ("Build Eden S24+ APK" -> Run workflow),
# or push to the main branch. The installable APK is attached to the run as an artifact.

name: Build Eden S24+ APK

on:
  workflow_dispatch:
    inputs:
      lto:
        description: "Full link-time optimization (faster code, longer build). Off builds without LTO."
        type: boolean
        default: true
      pgo:
        description: "PGO: 'auto' uses a committed profile in pgo/ if present; 'generate' builds the instrumented APK used to record one"
        type: choice
        options: [auto, generate, "off"]
        default: auto
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: build-s24-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # publish symbol maps to the symbol-maps branch
  actions: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      NDK_VERSION: "28.2.13676358"
      CMAKE_VERSION: "3.31.5"
      CCACHE: "true"
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: "3G"
      CCACHE_COMPRESS: "true"
      USE_LTO: ${{ (github.event_name == 'push' || inputs.lto) && inputs.pgo != 'generate' }}
      PGO: ${{ inputs.pgo || 'auto' }}

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/.ghcup \
                      /usr/local/share/powershell /usr/share/swift /opt/hostedtoolcache/CodeQL || true
          df -h /
          # Checkout runs `git init`; set the default branch so git doesn't print its hint.
          git config --global init.defaultBranch main

      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the app version name comes from `git describe`

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" "platforms;android-36" "build-tools;36.0.0"

      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y ccache ninja-build glslang-tools

      - name: Restore compiler cache
        uses: actions/cache@v6
        with:
          path: |
            .ccache
            .cache/cpm
          # One cache per build type: instrumented (pgo=generate) and normal/PGO builds use
          # different compiler flags and can't reuse each other's objects. Sharing one cache meant
          # alternating builds restored the wrong one and recompiled everything (~30 min).
          key: s24-${{ runner.os }}-${{ inputs.pgo == 'generate' && 'gen' || 'opt' }}-${{ github.sha }}
          restore-keys: s24-${{ runner.os }}-${{ inputs.pgo == 'generate' && 'gen' || 'opt' }}-

      - name: Restore Gradle cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('src/android/**/*.gradle.kts', 'src/android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Prepare PGO
        shell: bash
        run: |
          PGO_ARGS=""
          if [ "$PGO" = "generate" ]; then
            PGO_ARGS="-DEDEN_PGO_MODE=generate"
            echo "::notice::Building the PGO-instrumented APK (slower; used only to record a profile)"
          elif [ "$PGO" = "auto" ] && ls pgo/* >/dev/null 2>&1; then
            PROFDATA_BIN="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-profdata"
            work="$RUNNER_TEMP/pgo"; mkdir -p "$work"
            for f in pgo/*; do
              case "$f" in
                *.profdata) cp "$f" "$work/" ;;
                *.profraw) cp "$f" "$work/" ;;
                *.xz)  xz -dc "$f" > "$work/$(basename "${f%.xz}")" ;;
                *.zst) zstd -dc "$f" > "$work/$(basename "${f%.zst}")" ;;
                *.gz)  gzip -dc "$f" > "$work/$(basename "${f%.gz}")" ;;
                *.zip) unzip -o -j "$f" -d "$work" ;;
              esac
            done
            ls -l "$work"
            "$PROFDATA_BIN" merge -o "$RUNNER_TEMP/eden.profdata" $(ls "$work"/*.profraw "$work"/*.profdata 2>/dev/null)
            "$PROFDATA_BIN" show "$RUNNER_TEMP/eden.profdata" | tail -5
            PGO_ARGS="-DEDEN_PGO_MODE=use -DEDEN_PGO_PROFILE=$RUNNER_TEMP/eden.profdata"
            echo "::notice::Using PGO profile from pgo/"
          fi
          echo "PGO_ARGS=$PGO_ARGS" >> "$GITHUB_ENV"

      - name: Build APK (full LTO)
        if: env.USE_LTO == 'true'
        shell: bash
        run: |
          set -o pipefail
          chmod +x .ci/android/build.sh
          .ci/android/build.sh -t s24 -b Release -DENABLE_LTO=ON -DEDEN_FULL_LTO=ON $PGO_ARGS 2>&1 | tee -a "$RUNNER_TEMP/build.log"
          # Fail loudly if the library wasn't actually built with full LTO.
          grep -q -- "-- LTO: full (monolithic)" "$RUNNER_TEMP/build.log"

      - name: Build APK (instrumented / LTO disabled by input)
        if: env.USE_LTO != 'true'
        shell: bash
        run: |
          set -o pipefail
          chmod +x .ci/android/build.sh
          .ci/android/build.sh -t s24 -b Release $PGO_ARGS 2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Show build errors
        if: failure()
        shell: bash
        run: |
          L="$RUNNER_TEMP/build.log"
          enc() { sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g'; }
          grep -n -E ': error:|CMake Error|What went wrong|FAILURE:|Execution failed|ld.lld: error|Caused by|^-- ! ' "$L" | cut -c1-300 | head -25 | tail -c 3800 > "$RUNNER_TEMP/e1.txt" || true
          tail -30 "$L" | cut -c1-300 | tail -c 3800 > "$RUNNER_TEMP/e2.txt" || true
          echo "::error title=Build errors::$(enc < "$RUNNER_TEMP/e1.txt")"
          echo "::error title=Build tail::$(enc < "$RUNNER_TEMP/e2.txt")"

      - name: Rename APK
        run: |
          ls -l artifacts
          VERSION=$(git describe --always --long | sed -E 's/(-0)?-[^-]+$//')
          mkdir -p upload
          SUFFIX=""; [ "$PGO" = "generate" ] && SUFFIX="-PGO-INSTRUMENTED"
          for f in artifacts/*.apk; do cp "$f" "upload/Eden-S24plus-${VERSION}${SUFFIX}.apk"; done
          ls -l upload

      - name: APK size breakdown
        continue-on-error: true
        shell: bash
        run: |
          apk=$(ls upload/*.apk | head -1)
          ls -l "$apk"
          # Biggest entries: compressed size, uncompressed size, path
          unzip -lv "$apk" | awk 'NR>3 && $1 ~ /^[0-9]+$/ {printf "%9d %9d %s\n", $3, $1, $8}' | sort -nr > "$RUNNER_TEMP/sizes_all.txt"
          head -25 "$RUNNER_TEMP/sizes_all.txt" > "$RUNNER_TEMP/sizes.txt"
          cat "$RUNNER_TEMP/sizes.txt"
          msg=$( { echo "compressed  uncompressed  path"; cat "$RUNNER_TEMP/sizes.txt"; } | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          echo "::notice title=APK size breakdown::$msg"

      - name: Collect native symbols
        continue-on-error: true
        shell: bash
        run: |
          # Unstripped libyuzu-android.so, for turning crash-report addresses into function names.
          mkdir -p symbols
          f=$(find src/android/app/build -path '*merged_native_libs*' -name libyuzu-android.so | head -1)
          [ -n "$f" ] && cp "$f" symbols/ && ls -l symbols

      - name: Check every static initializer runs
        shell: bash
        run: |
          od=$(ls "$ANDROID_HOME"/ndk/*/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump | tail -1)
          python3 .ci/android/check_static_init.py "$od" symbols/libyuzu-android.so

      - name: Publish symbol map
        # Keeps the unstripped library and a sorted symbol map for each build on the
        # symbol-maps branch, so crash addresses can be resolved offline with git + llvm tools.
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bin=$(dirname "$(ls "$ANDROID_HOME"/ndk/*/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm | tail -1)")
          so="$PWD/symbols/libyuzu-android.so"
          build_id=$("$bin/llvm-readelf" -n "$so" | awk '/Build ID/ {print $3}')
          name="${GITHUB_RUN_ID}-${GITHUB_SHA::7}-${build_id}"
          work=$(mktemp -d)
          cd "$work"
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin symbol-maps 2>/dev/null; then
            git checkout -q FETCH_HEAD -- . 2>/dev/null || true
          fi
          mkdir -p maps libs
          {
            echo "# run ${GITHUB_RUN_ID}  commit ${GITHUB_SHA}  build-id ${build_id}"
            echo "# address size type symbol (sorted by address)"
            "$bin/llvm-nm" -n -S -C --defined-only "$so"
          } | xz -6 > "maps/${name}.txt.xz"
          xz -6 -T0 -c "$so" > "libs/${name}.so.xz"
          # Keep maps for the last 30 builds and libraries for the last 4 (run IDs only grow).
          ls maps/*.txt.xz | sort -t/ -k2 -n | head -n -30 | xargs -r rm -f
          ls libs/*.so.xz | sort -t/ -k2 -n | head -n -4 | xargs -r rm -f
          {
            echo "# Eden S24+ symbol maps"
            echo
            echo "Files are named <run id>-<commit>-<ELF build id>. A tombstone's build id for"
            echo "libyuzu-android.so identifies the exact file. Resolve addresses with:"
            echo
            echo '    xz -dk libs/<name>.so.xz && llvm-symbolizer --obj=libs/<name>.so --inlines -C 0x...'
            echo
            echo "| run | commit | build id |"
            echo "|---|---|---|"
            for f in $(ls maps/*.txt.xz | sort -t/ -k2 -nr); do
              b=$(basename "$f" .txt.xz); IFS=- read -r r c i <<<"$b"
              echo "| $r | $c | $i |"
            done
          } > README.md
          git checkout -q --orphan publish
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -q -m "Symbols for run ${GITHUB_RUN_ID} (${GITHUB_SHA::7}, build id ${build_id})"
          git push -q -f origin HEAD:refs/heads/symbol-maps
          echo "Published ${name}"

      - name: Upload native symbols
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: Eden-S24plus-symbols
          path: symbols/*.so
          if-no-files-found: warn
          retention-days: 30

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Eden-S24plus-APK
          path: upload/*.apk
          if-no-files-found: error
          retention-days: 30
