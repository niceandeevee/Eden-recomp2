name: Symbolize crash addresses

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build run ID whose Eden-S24plus-symbols artifact matches the crashing APK"
        required: true
      addresses:
        description: "Space-separated rel_pc values from the crash report (hex, e.g. 0xbeee64)"
        required: true
      symbol_filter:
        description: "Optional regex: list matching symbols (llvm-nm) with addresses"
        required: false
        default: ""
      find_refs:
        description: "Optional data address (hex): list functions whose code forms that address (adrp+add/ldr/str)"
        required: false
        default: ""

permissions:
  actions: read
  contents: read

jobs:
  symbolize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Eden-S24plus-symbols
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: symbols

      - name: Symbolize
        shell: bash
        run: |
          sudo apt-get install -y -qq llvm >/dev/null 2>&1 || true
          SYM=$(command -v llvm-symbolizer || ls /usr/bin/llvm-symbolizer-* | head -1)
          lib=$(ls symbols/*.so | head -1)
          out=""
          for a in ${{ inputs.addresses }}; do
            fn=$("$SYM" --obj="$lib" --functions=linkage --demangle "$a" | head -1)
            out+="$a  ${fn}"$'\n'
            echo "== $a (with inlined frames)"
            "$SYM" --obj="$lib" --inlines --functions=linkage --demangle "$a"
          done
          echo "$out"
          if [ -n "${{ inputs.symbol_filter }}" ]; then
            NM=$(command -v llvm-nm || ls /usr/bin/llvm-nm-* | head -1)
            echo "== symbols matching: ${{ inputs.symbol_filter }}"
            "$NM" -C -S "$lib" | grep -E "${{ inputs.symbol_filter }}" | head -200
          fi
          if [ -n "${{ inputs.find_refs }}" ]; then
            OD=$(command -v llvm-objdump || ls /usr/bin/llvm-objdump-* | head -1)
            target=$(( ${{ inputs.find_refs }} ))
            page=$(printf '0x%x' $(( target & ~0xfff )))
            off=$(printf '0x%x' $(( target & 0xfff )))
            echo "== code forming ${{ inputs.find_refs }} (page $page, offset $off)"
            "$OD" -d --no-show-raw-insn --print-imm-hex -C "$lib" \
              | awk -v page="$page" -v off="#$off" '
                  /^[0-9a-f]+ <.*>:$/ { fn=$0; next }
                  index($0, "adrp") && index($0, page) { armed=4; next }
                  armed > 0 { armed--; if (index($0, off)) { print fn; armed=0 } }' \
              | sort | uniq -c | head -100
            echo "== init_array"
            "$OD" -s -j .init_array "$lib" | head -40
          fi
          msg=$(printf '%s' "$out" | cut -c1-300 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          echo "::notice title=Symbolized::$msg"
