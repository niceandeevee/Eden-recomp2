name: Symbolize crash addresses

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build run ID whose Eden-S24plus-symbols artifact matches the crashing APK"
        required: true
      addresses:
        description: "Space-separated rel_pc values from the crash report (hex, e.g. 0xbeee64)"
        required: true
      symbol_filter:
        description: "Optional regex: list matching symbols (llvm-nm) with addresses"
        required: false
        default: ""

permissions:
  actions: read
  contents: read

jobs:
  symbolize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Eden-S24plus-symbols
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: symbols

      - name: Symbolize
        shell: bash
        run: |
          sudo apt-get install -y -qq llvm >/dev/null 2>&1 || true
          SYM=$(command -v llvm-symbolizer || ls /usr/bin/llvm-symbolizer-* | head -1)
          lib=$(ls symbols/*.so | head -1)
          out=""
          for a in ${{ inputs.addresses }}; do
            fn=$("$SYM" --obj="$lib" --functions=linkage --demangle "$a" | head -1)
            out+="$a  ${fn}"$'\n'
            echo "== $a (with inlined frames)"
            "$SYM" --obj="$lib" --inlines --functions=linkage --demangle "$a"
          done
          echo "$out"
          if [ -n "${{ inputs.symbol_filter }}" ]; then
            NM=$(command -v llvm-nm || ls /usr/bin/llvm-nm-* | head -1)
            echo "== symbols matching: ${{ inputs.symbol_filter }}"
            "$NM" -C -S "$lib" | grep -E "${{ inputs.symbol_filter }}" | head -200
          fi
          msg=$(printf '%s' "$out" | cut -c1-300 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
          echo "::notice title=Symbolized::$msg"
