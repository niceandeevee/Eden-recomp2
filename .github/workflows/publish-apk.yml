# Puts a finished build's APK on the `apk` branch so it has a direct download link
# (artifact downloads are zipped and need a signed-in GitHub session; this repo's token
# can't create releases).
name: Publish APK release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build run ID whose Eden-S24plus-APK artifact to publish"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Download APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ inputs.run_id }}" -R "$GITHUB_REPOSITORY" -n Eden-S24plus-APK -D apk
          ls -l apk

      - name: Publish to the apk branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=${{ inputs.run_id }}
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq .head_sha)
          src=$(realpath "$(ls apk/*.apk | head -1)")
          set -euo pipefail
          work=$(mktemp -d)
          cp "$src" "$work/Eden-S24plus.apk"
          cd "$work"
          printf '%s\n' "# Latest Eden S24+ APK" "" "Build run ${run}, commit ${sha::7}." "" \
            "Direct download: https://github.com/${GITHUB_REPOSITORY}/raw/refs/heads/apk/Eden-S24plus.apk" > README.md
          git init -q
          git checkout -q --orphan apk
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -q -m "APK from build run ${run} (${sha::7})"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/apk
          echo "::notice title=APK::https://github.com/${GITHUB_REPOSITORY}/raw/refs/heads/apk/Eden-S24plus.apk"
